<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Статия — Nikolay Vasilev</title>
<meta name="description" content="Статия от личния блог на Николай Василев.">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<script>
(function () {
  try {
    var t = localStorage.getItem('nv-theme');
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="container">
    <a href="index.html#home" class="brand">
      <span class="brand-mark">NV</span>
      <span>Nikolay Vasilev</span>
    </a>
    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html#home" class="nav-link" data-i18n="nav.home">Начало</a></li>
        <li><a href="index.html#about" class="nav-link" data-i18n="nav.about">За мен</a></li>
        <li><a href="index.html#blog" class="nav-link" data-i18n="nav.blog">Блог</a></li>
        <li><a href="index.html#contact" class="nav-link" data-i18n="nav.contact">Контакти</a></li>
      </ul>
    </nav>
    <div class="nav-controls">
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Смени темата" title="Смени темата">🌙</button>
      <button class="icon-btn lang-btn" id="langToggle" type="button" aria-label="Смени езика" title="Смени езика">EN</button>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Меню" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>
  <div class="article-header">
    <div class="container">
      <a href="index.html#blog" class="back-link" data-i18n="post.back">← Обратно към блога</a>
      <div id="postMeta">
        <span class="post-date" id="postDate"></span>
        <h1 id="postTitle">Зареждане…</h1>
      </div>
    </div>
  </div>

  <div class="article-cover" id="articleCover" hidden>
    <img id="postCoverImg" src="" alt="">
  </div>

  <article class="article-body" id="postContent">
    <p class="empty-msg" data-i18n="post.loading">Зареждане на статията…</p>
  </article>

  <div class="article-footer">
    <a href="index.html#blog" class="btn btn-ghost" data-i18n="post.allposts">← Всички статии</a>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    &copy; <span id="year"></span> Nikolay Vasilev. <span data-i18n="footer.tagline">Направено с ♥ и хоствано на GitHub Pages.</span>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
